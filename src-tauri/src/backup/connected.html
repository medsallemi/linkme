<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Drive connected · Linkme</title>
  <style>
    :root {
      color-scheme: light dark;
      background: light-dark(#eff8f7, #0c232b);
      color: light-dark(#142b32, #e5f6f4);
      font: 1rem/1.5 "Segoe UI", system-ui, sans-serif;
    }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 30rem; }
    h1 { line-height: 1.16; margin: 0 0 16px; }
    a { display: inline-block; padding: 10px 20px; border-radius: 12px; background: light-dark(#124856, #bceee9); color: light-dark(#fff, #102e36); font-weight: 650; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Google Drive connected</h1>
    <p>Your account is ready for backups in Linkme.</p>
    <a href="linkme-desktop://open">Open Linkme</a>
    <p>If the browser asks for permission, choose <strong>Open Linkme</strong>. You can also switch back to Linkme yourself.</p>
  </main>
</body>
</html>
